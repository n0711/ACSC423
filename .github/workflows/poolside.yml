name: Poolside AR verification
on:
  push:
    paths: ['PoolsideAR/**', '.github/workflows/poolside.yml']
  pull_request:
    paths: ['PoolsideAR/**', '.github/workflows/poolside.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poolside-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PoolsideAR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint and APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: PoolsideAR
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Publish APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poolside-apk-and-reports
          path: |
            PoolsideAR/app/build/outputs/apk/debug/*.apk
            PoolsideAR/app/build/reports/
            PoolsideAR/core/build/reports/
            PoolsideAR/core/build/test-results/
          retention-days: 30
